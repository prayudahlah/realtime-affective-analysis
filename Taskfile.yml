version: '3'

tasks:
  default:
    desc: Daftar task yang tersedia
    cmds:
      - task --list

  up:
    desc: Jalankan seluruh service pipeline
    cmds:
      - docker compose up -d --build

  demo:
    desc: Jalankan demo dengan data replay
    cmds:
      - task: up
      - docker compose ps

  replay:
    desc: Kirim ulang sampel data ke pipeline
    cmds:
      - cmd: docker compose exec -T data-poller rm -f /app/data/replay_done
        ignore_error: true
      - docker compose restart data-poller

  down:
    desc: Hentikan seluruh service pipeline
    cmds:
      - docker compose down

  reset:
    desc: Hentikan service dan hapus semua volume data
    cmds:
      - docker compose down -v

  logs:
    desc: Ikuti log seluruh service
    cmds:
      - docker compose logs -f

  train:
    desc: Latih ulang model dan hasilkan artifact berversi
    dir: ml
    cmds:
      - uv run python -m affective_ml.train --config configs/default.yaml

  test:
    desc: Jalankan unit test dan validasi compose
    cmds:
      - task: test-ml
      - docker compose -f compose.test.yaml config --quiet

  test-ml:
    dir: ml
    cmds:
      - uv run pytest

  lint:
    desc: Jalankan ruff
    dir: ml
    cmds:
      - uv run ruff check .
