[project]
name = "affective-ml"
version = "0.1.0"
description = "Pelatihan model sentimen dan emosi ulasan e-commerce"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "emoji>=2.15.0",
    "imbalanced-learn>=0.13.0",
    "joblib>=1.4.0",
    "matplotlib>=3.10.0",
    "nltk>=3.9.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.0",
    "sastrawi>=1.0.1",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.0",
    "wordcloud>=1.9.0",
]

[project.scripts]
affective-train = "affective_ml.train:main"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/affective_ml"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
